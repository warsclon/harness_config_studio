name: Prepare or publish npm release
run-name: npm release ${{ github.event_name == 'push' && github.ref_name || inputs.commit }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character source commit to validate
        required: true
        type: string
      publish:
        description: Publish after qualification and approval in the npm-publish environment
        default: false
        type: boolean
      approved_sha256:
        description: SHA-256 from the previously qualified tarball (required to publish)
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.intent.outputs.commit }}
      publish: ${{ steps.intent.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Validate release intent
        id: intent
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DELETED: ${{ github.event.deleted }}
          PUBLISH: ${{ inputs.publish }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, appendFileSync } from 'node:fs';
          const env = process.env;
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const tagged = env.EVENT_NAME === 'push';
          assert.equal(env.REPOSITORY, 'warsclon/harness_config_studio');
          assert.match(commit, /^[a-f0-9]{40}$/);
          if (tagged) {
            assert.notEqual(env.DELETED, 'true', 'Deleted tags cannot publish');
            assert.match(env.REF_NAME, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Use a stable vX.Y.Z tag');
            const manifest = JSON.parse(readFileSync('package.json'));
            assert.equal(env.REF_NAME, `v${manifest.version}`, 'Tag and package version differ');
            execFileSync('git', ['merge-base', '--is-ancestor', commit, 'origin/main']);
          } else {
            assert.equal(env.EVENT_NAME, 'workflow_dispatch');
            assert.equal(env.SOURCE_COMMIT, commit, 'Use the full source commit');
            if (env.PUBLISH === 'true') {
              assert.equal(env.PUBLISH_ENABLED, 'true', 'Complete maintainer setup before enabling publication');
              assert.match(env.APPROVED_SHA256, /^[a-f0-9]{64}$/);
            }
          }
          const publish = tagged || env.PUBLISH === 'true';
          appendFileSync(env.GITHUB_OUTPUT, `commit=${commit}\npublish=${publish}\n`);
          if (publish && env.PUBLISH_ENABLED !== 'true') {
            appendFileSync(env.GITHUB_STEP_SUMMARY, 'Publication disabled: finish npm authentication and set NPM_PUBLISH_ENABLED=true. Validation still runs.\n');
          }
          JS

  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.preflight.outputs.commit }}
      retain_artifacts: true

  inspect:
    needs: [preflight, validate]
    outputs:
      sha256: ${{ steps.reconcile.outputs.sha256 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: candidate-node-*
          path: candidates
      - name: Reconcile the two tested artifacts
        id: reconcile
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          node scripts/verify-release.mjs candidates/candidate-node-22 "$SOURCE_COMMIT" ${APPROVED_SHA256:+"$APPROVED_SHA256"}
          node scripts/verify-release.mjs candidates/candidate-node-24 "$SOURCE_COMMIT" ${APPROVED_SHA256:+"$APPROVED_SHA256"}
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync, appendFileSync} from 'node:fs';
          const a = JSON.parse(readFileSync('candidates/candidate-node-22/evidence.json'));
          const b = JSON.parse(readFileSync('candidates/candidate-node-24/evidence.json'));
          assert.equal(a.tarball.sha256, b.tarball.sha256, 'Node matrices produced different packages');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${b.tarball.sha256}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Validated ${b.package.name}@${b.package.version}\n\nCommit: ${b.source.commit}\n\nSHA-256: ${b.tarball.sha256}\n\nReal Finder/Trash and public reporting must be qualified separately before approval.\n`);
          JS

  publish:
    if: ${{ needs.preflight.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true' }}
    needs: [preflight, inspect]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: candidate-node-24
          path: candidate
      - name: Check authentication mode
        env:
          AUTH_MODE: ${{ vars.NPM_AUTH_MODE || 'oidc' }}
        run: |
          case "$AUTH_MODE" in
            oidc|bootstrap) ;;
            *) echo 'Unsupported NPM_AUTH_MODE'; exit 1 ;;
          esac
      - name: Publish only the approved bytes with OIDC
        if: ${{ vars.NPM_AUTH_MODE != 'bootstrap' }}
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
          APPROVED_SHA256: ${{ needs.inspect.outputs.sha256 }}
        run: |
          tarball=$(node scripts/verify-release.mjs candidate "$SOURCE_COMMIT" "$APPROVED_SHA256")
          npm publish "$tarball" --access public --ignore-scripts
      - name: Publish the first version with a temporary token
        if: ${{ vars.NPM_AUTH_MODE == 'bootstrap' }}
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
          APPROVED_SHA256: ${{ needs.inspect.outputs.sha256 }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'Missing NPM_BOOTSTRAP_TOKEN environment secret'; exit 1; }
          tarball=$(node scripts/verify-release.mjs candidate "$SOURCE_COMMIT" "$APPROVED_SHA256")
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json'));
          assert.equal(manifest.name, 'harness-config-studio');
          assert.equal(manifest.version, '0.2.6', 'Bootstrap is restricted to the first version');
          const response = await fetch('https://registry.npmjs.org/harness-config-studio', {
            signal: AbortSignal.timeout(15000),
          });
          assert.equal(response.status, 404, 'Bootstrap requires an unpublished package; otherwise configure OIDC');
          JS
          npm publish "$tarball" --access public --ignore-scripts --provenance
