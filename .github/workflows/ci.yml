name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      retain_artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run site:check
      - run: npm run package:smoke -- --retain-dir release-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ inputs.retain_artifacts }}
        with:
          name: candidate-node-${{ matrix.node-version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
